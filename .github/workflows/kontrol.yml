name: Paket kontrolü

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağlantı, kod bloğu, özel veri ve checksum kontrolü
        run: python3 araclar/kontrol.py
